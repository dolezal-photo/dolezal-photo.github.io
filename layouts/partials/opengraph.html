{{- $settings := partialCached "settings.html" . -}}
{{- $meta := partial "page-meta.html" . -}}

<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="{{ $settings.spolecne.nazev_webu }}" />
<meta property="og:title" content="{{ $meta.titulek }}" />
<meta property="og:description" content="{{ $meta.popis | plainify }}" />
<meta property="og:locale" content="{{ replace site.Language.LanguageCode `-` `_` }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />

<meta
  property="og:image"
  content="{{ "images/sdileni/nahled.jpg" | absURL }}"
/>
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:alt" content="Doležal Photo – fotografie a video" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ $meta.titulek }}" />
<meta name="twitter:description" content="{{ $meta.popis | plainify }}" />
<meta
  name="twitter:image"
  content="{{ "images/sdileni/nahled.jpg" | absURL }}"
/>
